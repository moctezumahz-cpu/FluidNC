board: YD-ESP32-S3
name: FluidPlasma MCH
meta: THC-MCH HD Plasma Controller

stepping:
  engine: RMT
  idle_ms: 255
  pulse_us: 4
  dir_delay_us: 0

axes:
  shared_stepper_disable_pin: NO_PIN
  x:
    steps_per_mm: 250.0
    max_rate_mm_per_min: 5000.0
    acceleration_mm_per_sec2: 500.0
    max_travel_mm: 1000.0
    soft_limits: false
    motor0:
      stepstick:
        step_pin: gpio.5
        direction_pin: gpio.6
        disable_pin: NO_PIN
  y:
    steps_per_mm: 250.0
    max_rate_mm_per_min: 5000.0
    acceleration_mm_per_sec2: 500.0
    max_travel_mm: 1000.0
    soft_limits: false
    motor0:
      stepstick:
        step_pin: gpio.7
        direction_pin: gpio.8
        disable_pin: NO_PIN
  z:
    steps_per_mm: 1000.0
    max_rate_mm_per_min: 5000.0
    acceleration_mm_per_sec2: 200.0
    max_travel_mm: 200.0
    soft_limits: false
    motor0:
      stepstick:
        step_pin: gpio.16
        direction_pin: gpio.3
        disable_pin: NO_PIN

spindle:
  THC:
    start_pin: gpio.2
    ready_pin: gpio.39:pd
    pierce_timeout_ms: 5000

thc:
  txd_pin: gpio.17
  rxd_pin: gpio.18
  re_pin: gpio.21
  baud: 19200
  corner:
    pin: gpio.38
    threshold_pct: 70

probe:
  pin: NO_PIN

coolant:
  mist_pin: NO_PIN
  flood_pin: NO_PIN

start:
  must_home: false
