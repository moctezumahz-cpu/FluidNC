board: YD-ESP32-S3
name: FluidPlasma MCH
meta: THC-MCH HD Plasma Controller

stepping:
  engine: RMT
  idle_ms: 255
  pulse_us: 4
  dir_delay_us: 0

axes:
  shared_stepper_disable_pin: NO_PIN
  x:
    steps_per_mm: 250.0
    max_rate_mm_per_min: 5000.0
    acceleration_mm_per_sec2: 500.0
    max_travel_mm: 1000.0
    soft_limits: false
    motor0:
      stepstick:
        step_pin: gpio.5
        direction_pin: gpio.6
        disable_pin: NO_PIN
  y:
    steps_per_mm: 250.0
    max_rate_mm_per_min: 5000.0
    acceleration_mm_per_sec2: 500.0
    max_travel_mm: 1000.0
    soft_limits: false
    motor0:
      stepstick:
        step_pin: gpio.7
        direction_pin: gpio.8
        disable_pin: NO_PIN
  z:
    steps_per_mm: 1000.0
    max_rate_mm_per_min: 5000.0
    acceleration_mm_per_sec2: 200.0
    max_travel_mm: 200.0
    soft_limits: false
    motor0:
      stepstick:
        step_pin: gpio.16
        direction_pin: gpio.3
        disable_pin: NO_PIN

# Bridge RS-485 ESP32 <-> THC-MCH (seccion raiz, nombre que reconoce el firmware nuevo)
SerialTHC:
  txd_pin: gpio.17
  rxd_pin: gpio.18
  re_pin: gpio.21        # RE/DE RS-485 half-duplex
  baud: 19200
  uart_num: 1            # 1 = Serial1
  # air_pin: gpio.N     # presostato opcional: HIGH = presion OK (sin pin = siempre OK, no bloquea)

# Spindle THC: M3 enciende START y espera READY (seccion raiz, nombre que reconoce el firmware nuevo)
THCSpindle:
  start_pin: gpio.2
  ready_pin: gpio.39:pd
  # error_pin: gpio.N   # opto ERROR del THC (opcional)
  corner_pin: gpio.38   # salida anti-dive CORNER hacia el THC
  threshold_corner: 70  # % de velocidad bajo el cual activa corner
  pierce_timeout_ms: 5000   # espera de READY; subir en ambiente ruidoso (max 30000)

probe:
  pin: NO_PIN

coolant:
  mist_pin: NO_PIN
  flood_pin: NO_PIN

start:
  must_home: false
